<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap">

<style>
  @font-face {
    font-family: 'Paperozi';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-1Thin.woff2') format('woff2');
    font-weight: 100;
    font-display: swap;
  }
  @font-face {
    font-family: 'Paperozi';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-2ExtraLight.woff2') format('woff2');
    font-weight: 200;
    font-display: swap;
  }
  @font-face {
    font-family: 'Paperozi';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-3Light.woff2') format('woff2');
    font-weight: 300;
    font-display: swap;
  }
  @font-face {
    font-family: 'Paperozi';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: 'Paperozi';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');
    font-weight: 500;
    font-display: swap;
  }
  @font-face {
    font-family: 'Paperozi';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2') format('woff2');
    font-weight: 600;
    font-display: swap;
  }
  @font-face {
    font-family: 'Paperozi';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
  }
  @font-face {
    font-family: 'Paperozi';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2');
    font-weight: 800;
    font-display: swap;
  }
  @font-face {
    font-family: 'Paperozi';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-9Black.woff2') format('woff2');
    font-weight: 900;
    font-display: swap;
  }

  :root {
    --bg: #EFF4FC;
    --surface: #FFFFFF;
    --surface-hover: #F3F7FF;
    --border: #CBDBF2;
    --border-hover: #7FA8DE;
    --accent: #1C5FB8;
    --accent-bright: #0F4A98;
    --accent-glow: rgba(28, 95, 184, 0.10);
    --text-primary: #0B1B33;
    --text-secondary: #3C567C;
    --text-muted: #7C93B5;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; -webkit-font-smoothing: antialiased; }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Paperozi', 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(32px, 10vw, 60px) clamp(16px, 5vw, 20px) clamp(48px, 12vw, 80px);
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(77, 133, 201, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(77, 133, 201, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container { width: 100%; max-width: 520px; position: relative; z-index: 1; }

  /* ── LANGUAGE SWITCHER ── */
  .lang-switch {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 20;
    display: flex;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px;
  }

  .lang-btn {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    background: transparent;
    border: none;
    cursor: pointer;
    opacity: 0.55;
    transition: opacity 0.2s, background 0.2s, transform 0.2s;
    overflow: hidden;
  }

  .lang-btn img {
    width: 20px;
    height: 20px;
    object-fit: cover;
    border-radius: 50%;
    display: block;
    box-shadow: 0 0 0 1px rgba(11, 27, 51, 0.08);
  }

  .lang-btn:hover { opacity: 0.9; background: var(--surface-hover); }
  .lang-btn.active { opacity: 1; background: var(--accent-glow); box-shadow: inset 0 0 0 1px var(--border-hover); }

  @media (max-width: 520px) {
    .lang-switch { top: 12px; right: 12px; padding: 4px; }
    .lang-btn { width: 28px; height: 28px; }
    .lang-btn img { width: 18px; height: 18px; }
  }

  /* ── HEADER ── */
  .header { text-align: center; margin-bottom: 40px; margin-top: 20px; }

  .eyebrow {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.25em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .eyebrow::before, .eyebrow::after {
    content: '';
    display: block;
    width: 28px;
    height: 1px;
    background: var(--accent);
    opacity: 0.5;
  }

  .header-title {
    font-family: 'Paperozi', 'Noto Sans KR', sans-serif;
    font-size: clamp(24px, 7vw, 30px);
    font-weight: 800;
    line-height: 1.3;
    letter-spacing: -0.01em;
    margin-bottom: 12px;
  }

  .header-title span { color: var(--accent); }

  .header-desc {
    font-size: 13px;
    font-weight: 300;
    color: var(--text-secondary);
    line-height: 1.7;
  }

  /* ── CATEGORY CARDS (home view) ── */
  .cat-list { display: flex; flex-direction: column; gap: 16px; }

  .cat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    text-align: left;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
    gap: 10px;
    color: inherit;
    font-family: inherit;
    width: 100%;
  }

  .cat-card:hover {
    background: var(--surface-hover);
    border-color: var(--border-hover);
    transform: translateY(-2px);
    box-shadow: 0 8px 32px var(--accent-glow);
  }

  .cat-icon {
    font-size: 26px;
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent-glow);
    border-radius: 12px;
    margin-bottom: 4px;
  }

  .cat-title {
    font-family: 'Paperozi', 'Noto Sans KR', sans-serif;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  .cat-sub { font-size: 12.5px; font-weight: 300; color: var(--text-secondary); }

  .cat-more {
    margin-top: 6px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    color: var(--accent-bright);
  }

  .cat-more .arrow { transition: transform 0.2s; }
  .cat-card:hover .cat-more .arrow { transform: translateX(3px); }

  /* ── DETAIL VIEW ── */
  .detail-view { display: none; flex-direction: column; gap: 20px; }
  .detail-view.active { display: flex; }
  .cat-list.hidden { display: none; }

  .back-btn {
    align-self: flex-start;
    background: none;
    border: none;
    color: var(--text-secondary);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    padding: 6px 0;
    transition: color 0.2s;
  }

  .back-btn:hover { color: var(--accent-bright); }

  .detail-title {
    font-family: 'Paperozi', 'Noto Sans KR', sans-serif;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  .spot-list { display: flex; flex-direction: column; gap: 16px; }

  .spot-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }

  .spot-photo {
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    position: relative;
    background: linear-gradient(135deg, var(--photo-a, #16233B), var(--photo-b, #0B1220));
  }

  .spot-photo::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.06) 0, transparent 45%),
      linear-gradient(rgba(77,133,201,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(77,133,201,0.05) 1px, transparent 1px);
    background-size: auto, 20px 20px, 20px 20px;
  }

  .spot-photo span { position: relative; z-index: 1; filter: drop-shadow(0 2px 10px rgba(0,0,0,0.4)); }

  .spot-photo.has-img { height: 190px; }
  .spot-photo.has-img::after { display: none; }
  .spot-photo img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .spot-num {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 1;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: #fff;
    background: rgba(11, 27, 51, 0.6);
    border-radius: 999px;
    padding: 4px 10px;
  }

  .spot-credit {
    margin-top: 10px;
    font-size: 10px;
    font-weight: 300;
    color: var(--text-muted);
    line-height: 1.4;
  }

  .spot-now {
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
    margin: -4px 0 10px;
  }

  .spot-addr {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-muted);
    line-height: 1.5;
    margin-bottom: 14px;
    display: flex;
    gap: 6px;
  }

  .spot-body { padding: 18px 20px 20px; }

  .spot-title {
    font-family: 'Paperozi', 'Noto Sans KR', sans-serif;
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 8px;
    letter-spacing: -0.01em;
  }

  .spot-desc {
    font-size: 12.5px;
    font-weight: 300;
    color: var(--text-secondary);
    line-height: 1.65;
    margin-bottom: 16px;
  }

  .map-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    color: var(--accent-bright);
    text-decoration: none;
    border: 1px solid var(--border-hover);
    border-radius: 999px;
    padding: 8px 14px;
    transition: background 0.2s, border-color 0.2s;
  }

  .map-btn:hover { background: var(--accent-glow); border-color: var(--accent); }

  /* ── TO TOP ── */
  .to-top {
    position: fixed;
    right: 18px;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    z-index: 20;
    width: 44px;
    height: 44px;
    border-radius: 999px;
    border: 1px solid var(--border-hover);
    background: var(--surface);
    color: var(--accent-bright);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 6px 20px var(--accent-glow);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s, visibility 0.2s, background 0.2s;
  }

  .to-top.show { opacity: 1; visibility: visible; transform: translateY(0); }
  .to-top:hover { background: var(--surface-hover); }

  @media (max-width: 520px) {
    .to-top { right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  }

  /* ── FOOTER ── */
  .footer {
    margin-top: 48px;
    text-align: center;
    font-size: 11px;
    font-weight: 300;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    line-height: 1.8;
  }

  @media (max-width: 520px) {
    body { padding: 40px 16px 60px; }
    .header-title { font-size: 24px; }
    .cat-card { padding: 22px 18px; }
  }
</style>

<div class="lang-switch" id="langSwitch">
  <button class="lang-btn active" data-lang="ko" title="한국어" aria-label="한국어"><img src="https://flagcdn.com/w40/kr.png" alt="한국어"></button>
  <button class="lang-btn" data-lang="en" title="English" aria-label="English"><img src="https://flagcdn.com/w40/us.png" alt="English"></button>
  <button class="lang-btn" data-lang="zh-cn" title="中文（简体）" aria-label="Chinese Simplified"><img src="https://flagcdn.com/w40/cn.png" alt="中文（简体）"></button>
  <button class="lang-btn" data-lang="zh-tw" title="中文（繁體）" aria-label="Chinese Traditional"><img src="https://flagcdn.com/w40/tw.png" alt="中文（繁體）"></button>
  <button class="lang-btn" data-lang="ja" title="日本語" aria-label="Japanese"><img src="https://flagcdn.com/w40/jp.png" alt="日本語"></button>
</div>

<div class="container">

  <header class="header">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 class="header-title" id="headerTitle"></h1>
    <p class="header-desc" id="headerDesc"></p>
  </header>

  <div class="cat-list" id="catList">
    <button class="cat-card" data-cat="wartime">
      <div class="cat-icon">🏛️</div>
      <div class="cat-title" id="cat1Title"></div>
      <div class="cat-sub" id="cat1Sub"></div>
      <div class="cat-more"><span id="moreLabel1"></span><span class="arrow">→</span></div>
    </button>
    <button class="cat-card" data-cat="station">
      <div class="cat-icon">🚉</div>
      <div class="cat-title" id="cat2Title"></div>
      <div class="cat-sub" id="cat2Sub"></div>
      <div class="cat-more"><span id="moreLabel2"></span><span class="arrow">→</span></div>
    </button>
  </div>

  <div class="detail-view" id="detailView">
    <button class="back-btn" id="backBtn">← <span id="backLabel"></span></button>
    <h2 class="detail-title" id="detailTitle"></h2>
    <div class="spot-list" id="spotList"></div>
  </div>

  <footer class="footer">
    <p id="footerNote"></p>
  </footer>

</div>

<button class="to-top" id="toTop" aria-label="맨 위로" title="맨 위로">↑</button>

<script>
  const content = {
    ko: {
      eyebrow: 'BUSAN STATION AREA',
      title: '부산역에서 만나는<br><span>부산 관광명소</span>',
      desc: '가까운 관광지부터 역사 깊은 피란수도 유산까지,<br>네이버지도로 바로 확인하세요.',
      more: '더보기',
      back: '목록으로',
      mapBtn: '네이버지도에서 보기',
      footer: '방문 전 최신 운영시간을 다시 확인해 주세요.',
      cats: {
        wartime: { title: '피란수도 부산 유산', sub: '한국전쟁 1,023일의 기억이 남은 11곳' },
        station: { title: '부산역 인근 관광지', sub: '부산역에서 가까운 순으로 소개하는 16곳' }
      },
      dist: km => `부산역에서 직선거리 약 ${km}km`,
      spots: {
        wartime: [
          { name: '경무대', now: '현 임시수도기념관', desc: '1926년 경상남도지사 관사로 지어진 건물로, 한국전쟁 중 피란수도 부산의 대통령 관저로 사용되었습니다.' },
          { name: '임시중앙청', now: '현 동아대학교 석당박물관', desc: '옛 경상남도청 건물로, 피란 시절 정부 청사인 임시중앙청으로 쓰이며 국정의 중심 역할을 했습니다.' },
          { name: '국립중앙관상대', now: '현 부산기상관측소', desc: '배를 닮은 외관의 근대 건축물로, 전쟁 중 서울에서 옮겨온 국립중앙관상대가 이곳에서 기상 업무를 이어갔습니다.' },
          { name: '부산항 제1부두', now: '', desc: '유엔군 병력과 구호물자가 들어오고 수많은 피란민이 내린 곳으로, 전쟁을 버텨낸 물자 보급의 관문이었습니다.' },
          { name: '영도대교', now: '', desc: '1934년 개통한 도개교로, 피란길에 헤어진 가족들이 "영도다리에서 만나자"며 재회를 기약하던 장소입니다.' },
          { name: '복병산배수지', now: '', desc: '1910년 완공된 근대 상수도 시설로, 피란민으로 인구가 급증한 시기에도 원도심에 물을 공급했습니다.' },
          { name: '아미동 비석마을', now: '', desc: '피란민들이 일제강점기 공동묘지 위에 비석과 상석을 주춧돌 삼아 집을 짓고 삶을 일군 마을입니다.' },
          { name: '우암동 소막마을', now: '', desc: '일제강점기 소 검역소 막사를 칸칸이 나눠 피란민의 보금자리로 삼았던 곳으로, 당시의 주거 형태가 남아 있습니다.' },
          { name: '캠프 하야리아', now: '현 부산시민공원', desc: '옛 경마장 부지에 들어선 미군 기지로, 전쟁 중 유엔군 부산기지사령부가 자리했으며 반환 후 시민공원이 되었습니다.' },
          { name: '미국대사관 겸 미국공보원', now: '현 부산근현대역사관 별관', desc: '옛 동양척식주식회사 부산지점 건물로, 피란수도 시기 미국대사관과 미국공보원으로 사용되었습니다.' },
          { name: '유엔군 묘지', now: '재한유엔기념공원', desc: '1951년 조성된 세계 유일의 유엔군 묘지로, 한국전쟁에서 희생된 유엔군 전몰장병이 잠들어 있습니다.' }
        ],
        station: [
          { name: '구 백제병원', desc: '1922년 지어진 부산 최초의 근대식 개인 종합병원 건물로, 음식점·장교 숙소·영사관 등을 거쳐 지금은 카페와 갤러리로 쓰이고 있습니다.' },
          { name: '북두칠성도서관', desc: '부산역 바로 옆 건물 1층에 자리한 도서관으로, 둥근 서가가 인상적인 공간에서 여행 중 잠시 쉬어가기 좋습니다.' },

  const stationMeta = [

    { km: 0.6, img: 'Bukhang Waterfront Park.jpg', credit: KOGL, addr: '부산광역시 동구 이순신대로 164', q: '북항친수공원' },

    { km: 3.0, img: 'Lee Jung-seob Street.jpg', credit: KOGL, addr: '부산광역시 동구 범일동 1461-144 일원', q: '이중섭거리' },
    { km: 3.1, img: 'Busanjinseong.jpg', credit: '© Kwondaeo · CC BY-SA 4.0', addr: '부산광역시 동구 자성로 99', q: '부산진성' },
    { km: 12, img: 'Busan Aquarium.jpg', credit: KOGL, addr: '부산광역시 해운대구 해운대해변로 266', q: 'SEA LIFE 부산아쿠아리움' },
    { km: 15, img: 'Hoedong Reservoir.jpg', credit: KOGL, addr: '부산광역시 금정구 회동동 일원', q: '회동수원지' },
    { km: 23, img: 'Ahopsan Forest.jpg', credit: '© Xia · CC BY-SA 4.0', addr: '부산광역시 기장군 철마면 미동길 37-1', q: '아홉산숲' }
  ];

  const spotMeta = { wartime: wartimeMeta, station: stationMeta };

  const photoTint = {
    wartime: ['#2E6BC2', '#123A75'],
    station: ['#1C5FB8', '#0B2F63']
  };

  let state = { lang: 'ko', view: 'home', cat: null };

  function naverUrl(q) {
    return 'https://map.naver.com/p/search/' + encodeURIComponent(q);
  }

  function render() {
    const c = content[state.lang];

    document.getElementById('eyebrow').textContent = c.eyebrow;
    document.getElementById('headerTitle').innerHTML = c.title;
    document.getElementById('headerDesc').innerHTML = c.desc;

    document.getElementById('cat1Title').textContent = c.cats.wartime.title;
    document.getElementById('cat1Sub').textContent = c.cats.wartime.sub;
    document.getElementById('cat2Title').textContent = c.cats.station.title;
    document.getElementById('cat2Sub').textContent = c.cats.station.sub;
    document.getElementById('moreLabel1').textContent = c.more;
    document.getElementById('moreLabel2').textContent = c.more;
    document.getElementById('backLabel').textContent = c.back;
    document.getElementById('footerNote').textContent = c.footer;

    const catList = document.getElementById('catList');
    const detailView = document.getElementById('detailView');

    if (state.view === 'home') {
      catList.classList.remove('hidden');
      detailView.classList.remove('active');
    } else {
      catList.classList.add('hidden');
      detailView.classList.add('active');

      const cat = state.cat;
      document.getElementById('detailTitle').textContent = c.cats[cat].title;

      const tint = photoTint[cat];
      const spotList = document.getElementById('spotList');
      spotList.innerHTML = '';

      c.spots[cat].forEach((spot, i) => {
        const meta = spotMeta[cat][i] || {};
        const q = meta.q || spot.q;
        const num = `<span class="spot-num">${String(i + 1).padStart(2, '0')}</span>`;
        const credit = meta.credit ? `<div class="spot-credit">📷 ${meta.credit}</div>` : '';
        const photo = meta.img
          ? `<div class="spot-photo has-img"><img src="assets/busan.spots/${encodeURIComponent(meta.img)}" alt="${spot.name}" loading="lazy">${num}</div>`
          : `<div class="spot-photo" style="--photo-a:${tint[0]};--photo-b:${tint[1]}">${num}<span>${meta.icon || spot.icon}</span></div>`;
        const card = document.createElement('div');
        card.className = 'spot-card';
        card.innerHTML = `
          ${photo}
          <div class="spot-body">
            <div class="spot-title">${spot.name}</div>
            ${spot.now ? `<div class="spot-now">${spot.now}</div>` : ''}
            ${meta.km ? `<div class="spot-now">🚶 ${c.dist(meta.km)}</div>` : ''}
            <div class="spot-desc">${spot.desc}</div>
            ${meta.addr ? `<div class="spot-addr"><span>📌</span><span>${meta.addr}</span></div>` : ''}
            <a class="map-btn" href="${naverUrl(q)}" target="_blank" rel="noopener noreferrer">📍 ${c.mapBtn}</a>
            ${credit}
          </div>
        `;
        spotList.appendChild(card);
      });
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === state.lang);
    });
  }

  document.getElementById('langSwitch').addEventListener('click', (e) => {
    const btn = e.target.closest('.lang-btn');
    if (!btn) return;
    state.lang = btn.dataset.lang;
    render();
  });

  document.getElementById('catList').addEventListener('click', (e) => {
    const card = e.target.closest('.cat-card');
    if (!card) return;
    state.view = 'detail';
    state.cat = card.dataset.cat;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  document.getElementById('backBtn').addEventListener('click', () => {
    state.view = 'home';
    state.cat = null;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  const toTop = document.getElementById('toTop');
  toTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  window.addEventListener('scroll', () => {
    toTop.classList.toggle('show', window.scrollY > 400);
  }, { passive: true });

  render();
</script>
