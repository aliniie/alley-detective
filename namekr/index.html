<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Korean Name · 내 한국어 이름</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#4169E1; --red:#e1332e; --gray:#E0E0E0;
  --bg:#f6f7fb; --card:#ffffff; --ink:#1b1f2a; --sub:#5d6475; --line:#E0E0E0;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#12151d;--card:#1b2030;--ink:#eef0f6;--sub:#a3abbd;--line:#2c3348}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font-weight:700;color:var(--blue);letter-spacing:.02em}
.langs{display:flex;gap:4px}
.langs button{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
h1{font-size:28px;line-height:1.25;margin:28px 0 6px}
.lead{color:var(--sub);margin:0 0 22px}
.field{display:block;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 16px;transition:border-color .15s}
.field:focus-within{border-color:var(--blue)}
.field small{display:block;color:var(--sub);font-size:12px}
.field input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:24px;padding:4px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;align-items:center}
.chips span{font-size:12px;color:var(--sub)}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.chips button:hover{border-color:var(--blue);color:var(--blue)}

.mode{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.mode .grp{display:flex;flex-wrap:wrap;gap:6px;transition:opacity .15s}
.mode .grp.dim{opacity:.38}
.tag.jpn{color:var(--blue);border-color:var(--blue)}
.mode button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 14px;font:inherit;font-size:13px;cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.mode small{flex-basis:100%;color:var(--sub);font-size:12px}
.tag.hzm,.tag.hzh{color:var(--blue);border-color:var(--blue)}
.result{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 20px;position:relative;overflow:hidden}
.result::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--blue) 0 66%,var(--red) 66% 100%)}
.result .label{font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.08em}
.kname{font-family:"Noto Serif KR",serif;font-weight:900;font-size:clamp(40px,12vw,64px);line-height:1.2;margin:8px 0 4px;word-break:keep-all;min-height:1.2em}
.kname.empty{color:var(--line)}
.roman{color:var(--sub);font-size:14px;min-height:1.4em}
.row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.seal{flex:none;width:76px;height:76px;border:3px solid var(--red);border-radius:6px;color:var(--red);font-family:"Noto Serif KR",serif;font-weight:900;display:grid;place-items:center;transform:rotate(-5deg);background:rgba(225,51,46,.05);box-shadow:inset 0 0 0 2px rgba(225,51,46,.25)}
.seal .g{display:grid;grid-template-columns:repeat(var(--cols,1),auto);grid-auto-flow:column;grid-template-rows:repeat(var(--rows,1),auto);direction:rtl;font-size:var(--fs,34px);line-height:1.05;gap:0 2px}
.seal[hidden]{display:none}
.words{display:flex;flex-direction:column;gap:6px;margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.w{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--sub)}
.w b{color:var(--ink);font-weight:500}
.tag{font-size:11px;border-radius:999px;padding:1px 8px;border:1px solid var(--line)}
.tag.dict{color:var(--blue);border-color:var(--blue)}
.tag.rule{color:var(--sub)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.actions button{flex:1 1 140px;border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:500;cursor:pointer;background:var(--blue);color:#fff}
.actions button.alt{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.actions button:disabled{opacity:.35;cursor:not-allowed}
.msg{color:var(--red);font-size:14px;margin-top:10px;min-height:1.4em}
.note{margin-top:22px;font-size:13px;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">KOREAN NAME · 한글 이름</div>
    <div class="langs" id="langs">
      <button data-l="en">EN</button><button data-l="ja">日</button><button data-l="zh">简</button><button data-l="tw">繁</button><button data-l="ar">عربي</button>
    </div>
  </div>

  <h1 data-i="title"></h1>
  <p class="lead" data-i="lead"></p>

  <div class="chips" id="chips"><span data-i="try"></span></div>
  <label class="field">
    <small data-i="inputLabel"></small>
    <input id="name" type="text" autocomplete="off" dir="auto" autocapitalize="words" spellcheck="false" maxlength="60" data-ph="placeholder">
  </label>

  <div class="mode" id="mode">
    <div class="grp" id="grpLat">
      <button type="button" data-g="lat" data-m="en" data-i="lEn"></button>
      <button type="button" data-g="lat" data-m="ja" data-i="lJa"></button>
    </div>
    <div class="grp" id="grpHz">
      <button type="button" data-g="hz" data-m="man" data-i="hzm"></button>
      <button type="button" data-g="hz" data-m="han" data-i="hzh"></button>
    </div>
    <small data-i="hzNote"></small>
  </div>

  <section class="result" aria-live="polite">
    <div class="label" data-i="resultLabel"></div>
    <div class="row">
      <div>
        <div class="kname empty" id="kname">한글</div>
        <div class="roman" id="roman"></div>
      </div>
      <div class="seal" id="seal" hidden><div class="g" id="sealg"></div></div>
    </div>
    <div class="words" id="words"></div>
    <div class="msg" id="msg"></div>
    <div class="actions">
      <button id="speak" disabled data-i="speak"></button>
      <button id="copy" class="alt" disabled data-i="copy"></button>
      <button id="save" class="alt" disabled data-i="save"></button>
    </div>
  </section>

  <p class="note" data-i="note"></p>
</div>

  if(!raw){setEmpty();return}
  if(/[ㄱ-ㆎ가-힣]/.test(raw)){setEmpty();el.msg.textContent=s.already;return}
  const isHz=/[㐀-鿿]/.test(raw),isKana=/[぀-ヿ]/.test(raw),isAr=/[؀-ۿ]/.test(raw);
  const isLat=!isHz&&!isKana&&!isAr;
  $('grpLat').classList.toggle('dim',!isLat);
  $('grpHz').classList.toggle('dim',!isHz);
  if(isKana){
    const toks=raw.split(/[\s\-_.·・]+/).filter(Boolean);
    const res=toks.map(kanaToHangul);
    const bad=res.findIndex(r=>!r);
    if(bad>=0){setEmpty();el.msg.textContent=s.cantConvert;return}
    return finish(res,toks,setEmpty);
  }
  if(isHz){
    const toks=raw.split(/[\s\-_.·]+/).filter(Boolean);
    const res=toks.map((t,i)=>convertHanzi(t,hzMode,i===0));
    const miss=res.find(r=>r&&r.missing);
    if(miss){setEmpty();el.msg.textContent=s.hzMissing+miss.missing;return}
    return finish(res,toks,setEmpty);
  }
  if(/[؀-ۿ]/.test(raw)){
    const eng=raw.split(/[\s\-_.]+/).filter(Boolean);
    return finish(eng.map(convertArabic),eng,setEmpty);
  }
  const norm=raw.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').replace(/[æÆ]/g,'e').replace(/[øØ]/g,'o');
  if(/[^\x00-\x7F]/.test(norm)){setEmpty();el.msg.textContent=s.unsupported;return}
  const parts=norm.split(/[\s\-_.]+/).map(p=>p.toLowerCase().replace(/[^a-z]/g,'')).filter(Boolean);
  const eng=norm.split(/[\s\-_.]+/).filter(p=>/[a-z]/i.test(p));
  if(!parts.length){setEmpty();return}
  if(latinMode==='ja')return finish(eng.map(e=>romajiToHangul(e.toLowerCase().replace(/[^a-z']/g,''))),eng,setEmpty);
  finish(parts.map(convertWord),eng,setEmpty);
}
function finish(res,eng,setEmpty){
  const s=T[lang];
  if(res.some(r=>!r)){setEmpty();el.msg.textContent=s.cantConvert;return}
  const korean=res.map(r=>r.k).join(' ');
  el.kname.textContent=korean;el.kname.classList.remove('empty');
  el.roman.textContent=eng.join(' ');
  renderSeal(res.length>1?res[0].k:res[0].k);
  res.forEach((r,i)=>{
    const d=document.createElement('div');d.className='w';
    d.innerHTML='<span>'+eng[i].replace(/[<>&]/g,'')+' → <b>'+r.k+'</b></span><span class="tag '+r.src+'">'+s[r.src]+'</span>';
    el.words.appendChild(d);
  });
  current={korean,english:eng.join(' ')};
  [el.speak,el.copy,el.save].forEach(b=>b.disabled=false);
}

/* examples: [text, latin mode to switch to] */
[['王小明'],['陳大文'],['やまだ たろう'],['Sato Yuki','ja'],['محمد أحمد'],['فاطمة'],['Emma Smith','en'],['Michael Jordan','en'],['Sophie','en'],['Alexander','en'],['Christopher Brown','en'],['Kate','en'],['Frank','en'],['Hannah','en']].forEach(([n,m])=>{
  const b=document.createElement('button');b.type='button';b.textContent=n;
  b.onclick=()=>{if(m){latinMode=m;syncMode()}el.name.value=n;update()};$('chips').appendChild(b);
});

el.name.addEventListener('input',update);
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{
  if(b.dataset.g==='lat')latinMode=b.dataset.m;else hzMode=b.dataset.m;
  syncMode();update();
});
function syncMode(){document.querySelectorAll('#mode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===(b.dataset.g==='lat'?latinMode:hzMode)))}
syncMode();
document.querySelectorAll('#langs button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;applyLang()});

el.speak.onclick=()=>{
  if(!current.korean||!('speechSynthesis' in window))return;
  const u=new SpeechSynthesisUtterance(current.korean);u.lang='ko-KR';u.rate=.8;
  speechSynthesis.cancel();speechSynthesis.speak(u);
};
el.copy.onclick=async()=>{
  try{await navigator.clipboard.writeText(current.korean)}catch(e){
    const ta=document.createElement('textarea');ta.value=current.korean;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}
  const o=el.copy.textContent;el.copy.textContent=T[lang].copied;setTimeout(()=>el.copy.textContent=o,1400);
};
el.save.onclick=async()=>{
  const W=1000,H=560,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  try{await document.fonts.load('900 120px "Noto Serif KR"',current.korean)}catch(e){}
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  x.fillStyle='#4169E1';x.fillRect(0,0,W*.66,16);x.fillStyle='#e1332e';x.fillRect(W*.66,0,W*.34,16);
  x.strokeStyle='#E0E0E0';x.lineWidth=4;x.strokeRect(2,2,W-4,H-4);
  x.fillStyle='#4169E1';x.font='700 26px "Noto Sans KR",sans-serif';x.textAlign='left';x.fillText(T[lang].cardTitle,56,84);
  let fs=170;x.font='900 '+fs+'px "Noto Serif KR",serif';
  while(x.measureText(current.korean).width>W-112-150&&fs>40){fs-=6;x.font='900 '+fs+'px "Noto Serif KR",serif'}
  x.fillStyle='#1b1f2a';x.fillText(current.korean,56,300);
  x.fillStyle='#5d6475';x.font='500 36px "Noto Sans KR",sans-serif';x.fillText(current.english,56,370);
  x.fillStyle='#E0E0E0';x.fillRect(56,470,W-112,3);
  x.fillStyle='#5d6475';x.font='400 22px "Noto Sans KR",sans-serif';x.fillText('Busan Station · 부산역',56,512);
  // seal
  const chars=[...current.korean.split(' ')[0]].slice(0,4);
  x.save();x.translate(W-120,H-190);x.rotate(-.09);
  x.strokeStyle='#e1332e';x.fillStyle='#e1332e';x.lineWidth=7;x.fillStyle='rgba(225,51,46,.06)';x.fillRect(-80,-80,160,160);x.strokeRect(-80,-80,160,160);
  x.fillStyle='#e1332e';x.textAlign='center';x.textBaseline='middle';
  if(chars.length>2){x.font='900 62px "Noto Serif KR",serif';chars.forEach((ch,i)=>x.fillText(ch,i%2?-34:34,(i<2?-38:34)+((i%2)?0:0)+(Math.floor(i/2)?0:0)))}
  else{x.font='900 '+(chars.length===2?66:100)+'px "Noto Serif KR",serif';chars.forEach((ch,i)=>x.fillText(ch,0,chars.length===2?(i?38:-38):0))}
  x.restore();
  cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='my-korean-name.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)});
};

applyLang();
</script>
