<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lost Parcel · 만족도 조사</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%8E%3C/text%3E%3C/svg%3E">
<style>
  @font-face{font-family:'Suit';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_suit@1.0/SUIT-Regular.woff2') format('woff2');font-weight:normal;font-display:swap;}
  @font-face{font-family:'Suit';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_suit@1.0/SUIT-Medium.woff2') format('woff2');font-weight:500;font-display:swap;}
  @font-face{font-family:'Suit';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_suit@1.0/SUIT-SemiBold.woff2') format('woff2');font-weight:600;font-display:swap;}
  @font-face{font-family:'Suit';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_suit@1.0/SUIT-Bold.woff2') format('woff2');font-weight:700;font-display:swap;}
  @font-face{font-family:'Suit';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_suit@1.0/SUIT-ExtraBold.woff2') format('woff2');font-weight:800;font-display:swap;}
  @font-face{font-family:'Suit';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_suit@1.0/SUIT-Heavy.woff2') format('woff2');font-weight:900;font-display:swap;}

  :root{
    --blue:#4169E1;        /* accent 1 */
    --blue-deep:#2F4FC4;
    --blue-soft:#EEF1FF;
    --red:#E1332E;         /* accent 2 : stamp only */
    --navy:#16225A;
    --line:#E0E0E0;
    --paper:#FAFAF8;
    --panel:#F5F6F8;
    --ink:#141414;
    --ink-soft:#5B6B82;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  *{scrollbar-width:none; -ms-overflow-style:none;}
  *::-webkit-scrollbar{width:0; height:0; display:none;}
  html, body{min-height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Suit', -apple-system, 'Apple SD Gothic Neo', 'Hiragino Sans', 'PingFang SC', 'Microsoft JhengHei', sans-serif;
    font-size:16px; line-height:1.6;
    display:flex; justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  button, input, textarea{font-family:inherit;}
  :focus-visible{outline:3px solid rgba(65,105,225,.45); outline-offset:2px;}

  .stage{
    width:min(100vw, 480px);
    min-height:100dvh;
    background:#fff;
    display:flex; flex-direction:column;
  }
  @media (min-width:520px){
    .stage{ border-left:1px solid var(--line); border-right:1px solid var(--line); }
  }

  /* ---- Header ---- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 20px 0;
  }
  .brand{display:flex; align-items:center; gap:8px; font-size:16px; font-weight:800; letter-spacing:-.01em;}
  .brand svg{width:20px; height:20px; display:block;}
  .lang-switch{position:relative;}
  .lang-globe{
    height:36px; padding:0 12px; border-radius:10px;
    border:1px solid var(--line); background:#fff; color:var(--ink);
    font-size:14px; font-weight:600; cursor:pointer;
  }
  .lang-globe:hover{background:var(--panel);}
  .lang-menu{
    display:none; position:absolute; top:42px; right:0; z-index:30;
    flex-direction:column; gap:2px; min-width:140px;
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:6px;
    box-shadow:0 8px 24px rgba(20,20,20,.12);
  }
  .lang-menu.open{display:flex;}
  .lang-opt{
    border:none; background:transparent; color:var(--ink);
    font-size:15px; font-weight:600; text-align:left;
    padding:10px 12px; border-radius:8px; cursor:pointer; white-space:nowrap; min-height:44px;
  }
  .lang-opt:hover{background:var(--panel);}
  .lang-opt.active{background:var(--blue); color:#fff;}

  /* ---- Progress : "01 / 08" + stepped bar ---- */
  .progress{display:none; padding:22px 20px 0;}
  .progress.on{display:block;}
  .progress .row{display:flex; justify-content:space-between; align-items:baseline; font-size:14px; font-weight:700; color:var(--ink-soft); font-variant-numeric:tabular-nums;}
  .progress .row b{font-size:16px; color:var(--ink); font-weight:800;}
  .track{margin-top:8px; height:6px; background:var(--line);}
  .track i{display:block; height:100%; width:0; background:var(--blue); transition:width .4s steps(8, end);}

  /* ---- Screens ---- */
  main{flex:1; display:flex; flex-direction:column;}
  .screen{flex:1; display:flex; flex-direction:column; padding:28px 20px 0; animation:slideIn .38s cubic-bezier(.2,.7,.2,1) both;}
  .screen.back{animation-name:slideBack;}
  @keyframes slideIn{from{opacity:0; transform:translateX(18px);} to{opacity:1; transform:none;}}
  @keyframes slideBack{from{opacity:0; transform:translateX(-18px);} to{opacity:1; transform:none;}}

  .kicker{font-size:13px; font-weight:800; color:var(--blue); letter-spacing:.14em; text-transform:uppercase;}
  h1{font-size:32px; font-weight:900; line-height:1.25; letter-spacing:-.02em; margin-top:10px;}
  h2.q{font-size:26px; font-weight:800; line-height:1.4; letter-spacing:-.015em; margin-top:10px; outline:none;}
  .hint{font-size:16px; color:var(--ink-soft); margin-top:10px;}
  .lead{margin-top:18px; font-size:16px; line-height:1.75; color:#2A3342;}
  .lead p + p{margin-top:14px;}

  /* ---- Option cards ---- */
  .opts{display:flex; flex-direction:column; gap:10px; margin-top:24px;}
  .opts.langs{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .opts.langs .opt:last-child:nth-child(odd){grid-column:1 / -1;}
  .opt{
    position:relative; width:100%; min-height:56px;
    display:flex; align-items:center; gap:14px; text-align:left;
    padding:12px 16px; border-radius:14px;
    background:#fff; border:1.5px solid var(--line);
    font-size:16px; font-weight:600; line-height:1.5; color:var(--ink);
    cursor:pointer; transition:background .15s, border-color .15s;
  }
  .opt:hover{background:var(--panel);}
  .opt .txt{flex:1; min-width:0;}
  .opt small{display:block; font-size:14px; font-weight:500; color:var(--ink-soft); margin-top:2px; line-height:1.5;}

  /* custom check (native radio is not used) */
  .chk{
    flex:none; width:24px; height:24px; border-radius:7px;
    border:1.5px solid #C4CAD6; background:#fff;
    display:grid; place-items:center; transition:background .15s, border-color .15s;
  }
  .chk svg{width:14px; height:14px; opacity:0; transform:scale(.6); transition:opacity .12s, transform .12s;}
  .opt[aria-checked=true]{border-color:var(--blue); background:var(--blue-soft); color:var(--navy); box-shadow:inset 0 0 0 1px var(--blue);}
  .opt[aria-checked=true] .chk{background:var(--blue); border-color:var(--blue);}
  .opt[aria-checked=true] .chk svg{opacity:1; transform:none;}

  /* pixel meter : 5 small squares, filled = level */
  .meter{flex:none; display:flex; gap:3px;}
  .meter i{width:8px; height:8px; background:var(--line);}
  .meter i.on{background:#9DB0F0;}
  .opt[aria-checked=true] .meter i{background:#CBD5F7;}
  .opt[aria-checked=true] .meter i.on{background:var(--blue);}

  .opt.lang{font-size:18px; font-weight:700; min-height:64px;}

  /* difficulty direction cue */
  .axis{display:flex; align-items:center; gap:10px; margin-top:22px; font-size:14px; font-weight:700; color:var(--ink-soft);}
  .axis .line{flex:1; height:2px; background:repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 10px);}
  .axis + .opts{margin-top:12px;}

  .other-input, textarea{
    width:100%; margin-top:10px; font-size:16px; line-height:1.6; color:var(--ink);
    padding:14px 16px; border-radius:14px; border:1.5px solid var(--line); background:var(--panel);
    outline:none; transition:border-color .15s, background .15s;
  }
  .other-input:focus, textarea:focus{border-color:var(--blue); background:#fff;}
  textarea{min-height:128px; resize:vertical; margin-top:24px; display:block;}
  textarea::placeholder, .other-input::placeholder{color:#8A94A6;}
  .count{text-align:right; font-size:14px; color:var(--ink-soft); margin-top:6px; font-variant-numeric:tabular-nums;}

  /* ---- Bottom nav ---- */
  .nav{
    position:sticky; bottom:0; z-index:10;
    display:flex; gap:10px; margin:auto -20px 0; padding:16px 20px calc(16px + env(safe-area-inset-bottom));
    background:linear-gradient(to bottom, rgba(255,255,255,0), #fff 18px);
  }
  .spacer{height:28px; flex:none;}
  .btn{
    min-height:56px; font-size:17px; font-weight:800; border-radius:14px; border:1.5px solid transparent; cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  .btn.primary{flex:1; background:var(--blue); color:#fff;}
  .btn.primary:hover{background:var(--blue-deep);}
  .btn.primary:disabled{background:#E3E6EE; color:#8A94A6; cursor:not-allowed;}
  .btn.ghost{flex:none; width:104px; background:#fff; color:var(--ink); border-color:var(--line);}
  .btn.ghost:hover{background:var(--panel);}

  .err{margin-top:12px; font-size:15px; color:var(--red); display:none;}
  .err.on{display:block;}

  /* ---- Done : mission-complete tone ---- */
  .done{align-items:center; text-align:center; justify-content:center; padding-bottom:40px;}
  .done .npcs{width:min(100%, 380px); height:auto; display:block; margin:-14px auto 10px; image-rendering:pixelated;}
  .done .kicker{color:var(--red);}
  .done h1{font-size:30px; margin-top:8px;}
  html:lang(ja) .done h1, html:lang(zh-Hans) .done h1, html:lang(zh-Hant) .done h1{font-size:25px;}
  .done .thanks{font-size:20px; font-weight:800; margin-top:14px;}
  .done .lead{max-width:340px; margin-top:10px;}
  .done{justify-content:flex-start; padding-top:56px;}
  .more{align-self:stretch; margin-top:40px; border-top:1.5px dashed var(--line); text-align:left;}
  .more-row{display:flex; align-items:center; justify-content:space-between; gap:14px; min-height:68px; padding:14px 4px; border-bottom:1px solid var(--line); color:var(--ink); text-decoration:none;}
  .more-row:hover{background:var(--panel);}
  .more-row .mt b{display:block; font-size:16px; font-weight:800; line-height:1.45;}
  .more-row .mt small{display:block; font-size:14px; color:var(--ink-soft); font-weight:500; line-height:1.5; margin-top:2px;}
  .more-row svg{flex:none; color:var(--blue);}
  .more-row:focus-visible{outline:3px solid rgba(65,105,225,.4); outline-offset:-3px;}

  .screen.still{animation:none;}
  .prompt{font-size:20px; font-weight:700; line-height:1.5; margin-top:10px;}
  h2.q.sm{font-size:21px; line-height:1.45;}
  .hint.sm{font-size:16px; margin-top:6px;}
  .lead.plain{white-space:pre-line;}
  .lead, .hint, .cnote, .consent dd{word-break:keep-all; overflow-wrap:break-word;}
  .lead .entry{font-weight:700; color:var(--navy);}

  /* ---- Inputs ---- */
  .field{
    display:block; width:100%; min-height:52px; margin-top:8px;
    font-size:16px; line-height:1.5; color:var(--ink);
    padding:12px 16px; border-radius:14px; border:1.5px solid var(--line); background:#fff;
    outline:none; transition:border-color .15s, background .15s;
  }
  .field:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(65,105,225,.16);}
  .field::placeholder{color:#8A94A6;}
  .field:disabled{background:var(--panel); color:#8A94A6;}
  .field.bad{border-color:var(--red);}
  .other-input{margin-top:10px;}
  .label{display:flex; align-items:center; gap:8px; margin-top:20px; font-size:16px; font-weight:700;}
  .req{font-style:normal; font-size:13px; font-weight:800; color:var(--blue);}
  .ferr{min-height:0; font-size:14px; color:var(--red); margin-top:6px; display:none;}
  .ferr.on{display:block;}
  .fields.off{opacity:.55;}

  /* ---- Country (foreign only) ---- */
  .country{margin-top:32px; padding-top:28px; border-top:1.5px dashed var(--line);}
  .country.reveal{animation:reveal .4s cubic-bezier(.2,.7,.2,1) both;}
  @keyframes reveal{from{opacity:0; transform:translateY(-10px);} to{opacity:1; transform:none;}}
  .combo{position:relative; margin-top:14px;}
  .combo .field{margin-top:0;}
  .combo-list{
    position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:15;
    max-height:min(260px, 38dvh); overflow-y:auto; list-style:none;
    background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:6px;
    box-shadow:0 8px 24px rgba(20,20,20,.12);
  }
  .combo-list[hidden]{display:none;}
  .combo-list li{
    display:flex; justify-content:space-between; gap:10px; align-items:center;
    min-height:48px; padding:10px 12px; border-radius:10px; font-size:16px; font-weight:600; cursor:pointer;
  }
  .combo-list li span{font-size:14px; font-weight:500; color:var(--ink-soft);}
  .combo-list li.act{background:var(--panel);}
  .combo-list li[aria-selected=true]{background:var(--blue-soft); color:var(--navy);}
  .combo-list li.none{cursor:default; color:var(--ink-soft); font-weight:500;}

  /* ---- Event (Korean only) ---- */
  .gift{ /* Naver Pay coupon */
    position:relative; margin-top:22px; display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:20px 18px 20px 22px; background:#00DE5A; color:var(--ink); border-radius:14px; overflow:hidden;
  }
  .gift::before, .gift::after{ /* ticket notches */
    content:''; position:absolute; top:50%; width:18px; height:18px; margin-top:-9px; border-radius:50%; background:#fff;
  }
  .gift::before{left:-9px;} .gift::after{right:-9px;}
  .gift-txt{min-width:0;}
  .gift-k{font-size:16px; font-weight:800; letter-spacing:-.01em;}
  .gift-amt{font-size:44px; font-weight:900; line-height:1.15; letter-spacing:-.03em; font-variant-numeric:tabular-nums;}
  .gift-amt small{font-size:24px; font-weight:800; margin-left:2px;}
  .gift-sub{font-size:15px; font-weight:700; margin-top:2px;}
  .gift-logo{flex:none; width:112px; height:auto; display:block; padding-left:10px;}

  /* ---- Face slider : one face glides left/right along a soft rail ---- */
  .sl-wrap{margin-top:26px;}
  .sl-cur{min-height:40px; text-align:center; font-size:24px; font-weight:800; letter-spacing:-.02em; color:var(--navy);}
  .sl-cur.idle{color:var(--ink-soft); font-size:16px; font-weight:600;}
  .slider{
    --f:.5;
    position:relative; height:96px; margin-top:6px; border-radius:20px;
    cursor:pointer; touch-action:pan-y; user-select:none; -webkit-user-select:none;
  }
  .slider:focus, .slider:focus-visible{outline:none;}
  .kbd .slider:focus{outline:3px solid rgba(65,105,225,.4); outline-offset:2px;}   /* 키보드 사용 시에만 */
  .rail{position:absolute; left:40px; right:40px; top:44px; height:8px; border-radius:99px; background:#E6EBF8;}
  .rail .fill{position:absolute; left:0; top:0; bottom:0; width:calc(var(--f) * 100%); border-radius:99px; background:var(--blue); opacity:0; transition:width .4s cubic-bezier(.22,.9,.3,1), opacity .2s;}
  .slider.has .rail .fill{opacity:.9;}
  .thumb{
    position:absolute; top:12px; width:72px; height:72px; margin-left:-36px; pointer-events:none;
    left:calc(40px + (100% - 80px) * var(--f));
    transition:left .45s cubic-bezier(.22,.9,.3,1), opacity .25s, filter .25s;
    filter:drop-shadow(0 6px 8px rgba(22,34,90,.16));
  }
  .thumb img{width:100%; height:100%; display:block; image-rendering:pixelated;}
  .slider.idle .thumb{opacity:.5; filter:grayscale(1);}
  .slider.dragging .thumb, .slider.dragging .rail .fill{transition:none;}
  .sl-ends{display:flex; justify-content:space-between; gap:12px; margin-top:2px; padding:0 8px; font-size:14px; font-weight:700; color:var(--ink-soft);}
  .sl-ends span:last-child{text-align:right;}

  /* ---- Line breaks ---- */
  html:lang(ko) body{word-break:keep-all;}
  html:lang(ja) body, html:lang(zh-Hans) body, html:lang(zh-Hant) body{line-break:strict; word-break:keep-all;}
  body{overflow-wrap:break-word;}
  h1, h2, h3, .prompt, .hint, .sl-cur, .kicker{text-wrap:balance;}
  p, .lead, .txt, small, dd, .cnote{text-wrap:pretty;}
  #confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:60;}
  .fields{margin-top:6px; transition:opacity .2s;}

  .consent{margin-top:34px; padding-top:26px; border-top:1.5px dashed var(--line);}
  .consent h3{font-size:18px; font-weight:800;}
  .consent dl{margin-top:12px; display:grid; gap:8px;}
  .consent dl div{display:grid; grid-template-columns:76px 1fr; gap:10px; font-size:14px; line-height:1.6;}
  .consent dt{font-weight:800; color:var(--ink-soft);}
  .consent dd{color:#2A3342;}
  .cnote{margin-top:12px; font-size:14px; line-height:1.65; color:var(--ink-soft);}
  .cnote.soft{color:var(--blue-deep); font-weight:600;}
  .opts.row{margin-top:16px;}
  .opt .txt{word-break:keep-all; overflow-wrap:break-word;}

  @media (prefers-reduced-motion:reduce){
    .country.reveal{animation:none;}
    .screen, .screen.back{animation:none;}
    .track i, .opt, .chk, .chk svg{transition:none;}
  }
</style>
</head>
<body>
<div class="stage">
  <header class="topbar">
    <div class="brand" id="brandName">잃어버린 소포</div>
    <div class="lang-switch">
      <button class="lang-globe" type="button" id="langBtn" aria-label="Language" aria-haspopup="true" aria-expanded="false"><span id="langLabel">한국어</span> ▾</button>
      <div class="lang-menu" id="langMenu">
        <button class="lang-opt" type="button" data-lang="ko">한국어</button>
        <button class="lang-opt" type="button" data-lang="en">English</button>
        <button class="lang-opt" type="button" data-lang="ja">日本語</button>
        <button class="lang-opt" type="button" data-lang="zh-Hans">简体中文</button>
        <button class="lang-opt" type="button" data-lang="zh-Hant">繁體中文</button>
      </div>
    </div>
  </header>
  <div class="progress" id="progress"><div class="row"><span id="pLeft"><b>01</b> / 08</span><span id="pLabel">QUESTION</span></div><div class="track"><i id="bar"></i></div></div>
  <main id="app"></main>
</div>

<script>
/* ============================================================
   설정 : 응답 수집 주소 (Google Apps Script 웹앱 URL)
   비워두면 이 기기(localStorage)에만 저장됩니다. → survey/README.md 참고
   ============================================================ */
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbyxG4uMVJOXEZYK5YRYioxWeQk2PqfsINoUvWuADmLbHpOjWvxhNRODQRzmSPL_0EbL/exec';
const MAX_TEXT = 1000;

const LANGS = {
  'ko':{label:'한국어', html:'ko'},
  'en':{label:'English', html:'en'},
  'ja':{label:'日本語', html:'ja'},
  'zh-Hans':{label:'简体中文', html:'zh-Hans'},
  'zh-Hant':{label:'繁體中文', html:'zh-Hant'},
};

/* ---------- 선택지 (값은 언어와 무관하게 저장) ---------- */
const SCALES = {
  sat : {ko:['매우 만족','만족','보통','불만족','매우 불만족'],
         en:['Very satisfied','Satisfied','Neutral','Dissatisfied','Very dissatisfied'],
         ja:['とても満足','満足','普通','不満','とても不満'],
         'zh-Hans':['非常满意','满意','一般','不满意','非常不满意'],
         'zh-Hant':['非常滿意','滿意','普通','不滿意','非常不滿意']},
  ease: {ko:['매우 쉬웠다','쉬웠다','보통이다','어려웠다','매우 어려웠다'],
         en:['Very easy','Easy','Average','Difficult','Very difficult'],
         ja:['とても分かりやすかった','分かりやすかった','普通','分かりにくかった','とても分かりにくかった'],
         'zh-Hans':['非常容易','容易','一般','困难','非常困难'],
         'zh-Hant':['非常容易','容易','普通','困難','非常困難']},
  diff: {ko:['매우 쉬웠다','쉬웠다','적당했다','어려웠다','매우 어려웠다'],
         en:['Very easy','Easy','Just right','Hard','Very hard'],
         ja:['とても簡単だった','簡単だった','ちょうどよかった','難しかった','とても難しかった'],
         'zh-Hans':['非常简单','简单','难度适中','困难','非常困难'],
         'zh-Hant':['非常簡單','簡單','難度適中','困難','非常困難']},

/* 국가 : ISO 3166-1 alpha-2 코드로 저장, 표시 이름은 브라우저(Intl)가 언어별로 제공 */
const COUNTRIES = ['US','CA','MX','BR','AR','CL','GB','FR','DE','IT','ES','PT','NL','BE','CH','AT','SE','NO','DK','FI','PL','CZ','RU','TR','AE','SA','IL','IN','PK','BD','LK','NP','TH','VN','PH','MY','ID','SG','KH','LA','MM','MN','KZ','UZ','JP','CN','TW','HK','MO','AU','NZ','ZA','EG','KR'];
const _countryCache = {};
function countryItems(){
  const loc = LANGS[state.lang].html;
  if(_countryCache[state.lang]) return _countryCache[state.lang];
  let dn, en; try{ dn=new Intl.DisplayNames([loc],{type:'region'}); en=new Intl.DisplayNames(['en'],{type:'region'}); }catch(e){}
  const items = COUNTRIES.map(c=>({code:c, name:(dn&&dn.of(c))||c, en:(en&&en.of(c))||c}));
  items.sort((a,b)=>a.name.localeCompare(b.name, loc));
  items.push({code:'OTHER', name:UI2[state.lang].other, en:'Other'});
  return (_countryCache[state.lang] = items);
}
const countryName = code => { const c = countryItems().find(x=>x.code===code); return c ? c.name : ''; };

/* 휴대전화 : 숫자만 받아 010-0000-0000 형태로 정리 */
function fmtPhone(v){
  const d = v.replace(/\D/g,'').slice(0,11);
  if(d.length<=3) return d;
  if(d.length<=7) return d.slice(0,3)+'-'+d.slice(3);
  return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);
}
const phoneOk = v => /^01[016789]\d{7,8}$/.test(v.replace(/\D/g,''));

function canProceed(){
  if(state.step===-2) return state.langChosen && (isKo() || !!state.country);
  if(state.step===EVENT) return state.consent!==null && (state.consent===false || (state.evName.trim().length>=2 && phoneOk(state.evPhone)));
  if(state.step>=0 && state.step<EVENT){ const q=QUESTIONS[state.step]; return !!q.optional || state.answers[q.id]!==undefined; }
  return true;
}
function refreshNext(){
  const b = $('#nextBtn'); if(b) b.disabled = state.sending || !canProceed();
}

/* ---------- 얼굴 슬라이더 (5단계) + 컨페티 ---------- */
const BRAND = {ko:'잃어버린 소포', en:'The Lost Parcel', ja:'失われた小包', 'zh-Hans':'遗失的包裹', 'zh-Hant':'遺失的包裹'};
const SLIDE_HINT = {ko:'밀거나 눌러서 선택해 주세요.', en:'Drag or tap to choose.', ja:'スライドまたはタップして選んでください。', 'zh-Hans':'拖动或点按来选择。', 'zh-Hant':'拖曳或點按來選擇。'};
/* 값 1~5 → 표정 이미지. 난이도: 1 매우 쉬움=emotion-05 … 5 매우 어려움=emotion-01 / 그 외(만족·이해·추천): 1=emotion-06(불만) … 5=emotion-10(만족) */
const faceFor = (scale, v) => 'assets/emotion-' + String(ltr(scale) ? 6-v : v+5).padStart(2,'0') + '.png';
/* 값 v에 해당하는 라벨 (SCALES 배열은 diff만 값 오름차순, 나머지는 긍정→부정 순) */
const ltr = scale => scale==='diff' || scale==='ease';   // 왼쪽=쉬움 → 오른쪽=어려움 (질문2·5 통일)
const scaleLabel = (scale, v) => SCALES[scale][state.lang][ltr(scale) ? v-1 : 5-v];
['01','02','03','04','05','06','07','08','09','10'].forEach(n=>{ new Image().src = 'assets/emotion-'+n+'.png'; });

function sliderHTML(q){
  const v = state.answers[q.id], on = v!==undefined, cv = on ? v : 3;
  const txt = on ? scaleLabel(q.scale,v) : SLIDE_HINT[state.lang];

      <div class="rail"><div class="fill"></div></div>
      <div class="thumb"><img id="slFace" src="${faceFor(q.scale,cv)}" alt="" width="72" height="72"></div>
    </div>

function setScale(el, v){
  const scale = el.dataset.scale, qid = el.dataset.q;
  if(state.answers[qid]===v) return;
  state.answers[qid] = v;
  el.classList.remove('idle'); el.classList.add('has');

  el.setAttribute('aria-valuetext', scaleLabel(scale,v));

  const cur = $('#slCur'); cur.textContent = scaleLabel(scale,v); cur.classList.remove('idle');

/* 0~1 위치 (손가락을 따라 연속으로 움직이고, 놓으면 가장 가까운 단계로 부드럽게 안착) */
function fracFromX(el, x){
  const r = el.getBoundingClientRect();
  return Math.min(1, Math.max(0, (x - r.left - 40) / (r.width - 80)));
}
document.addEventListener('keydown', e=>{ if(e.key==='Tab'||e.key.startsWith('Arrow')) document.body.classList.add('kbd'); });
document.addEventListener('pointerdown', ()=>document.body.classList.remove('kbd'));
let _drag = null, _x0 = 0;
function snap(el, v){ el.style.setProperty('--f', (v-1)/4); setScale(el, v); }
app.addEventListener('pointerdown', e=>{
  const el = e.target.closest('#slider'); if(!el) return;
  e.preventDefault();
  _drag = el; _x0 = e.clientX;
  try{ el.setPointerCapture(e.pointerId); }catch(_){}
  snap(el, Math.round(fracFromX(el, e.clientX)*4)+1);   // 누르면 그 위치로 스르륵 이동
});
app.addEventListener('pointermove', e=>{
  if(!_drag) return;
  if(Math.abs(e.clientX-_x0) > 4) _drag.classList.add('dragging');
  if(!_drag.classList.contains('dragging')) return;
  const f = fracFromX(_drag, e.clientX);
  _drag.style.setProperty('--f', f);
  setScale(_drag, Math.round(f*4)+1);
});
const endDrag = () => {
  if(!_drag) return;
  const el = _drag; _drag = null;
  const v = state.answers[el.dataset.q];
  el.classList.remove('dragging');
  if(v!==undefined) el.style.setProperty('--f', (v-1)/4);
};
app.addEventListener('pointerup', endDrag); app.addEventListener('pointercancel', endDrag);

function confetti(from){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const old = $('#confetti'); if(old) old.remove();
  const cv = document.createElement('canvas'); cv.id = 'confetti'; cv.setAttribute('aria-hidden','true');
  document.body.appendChild(cv);
  const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  const c = cv.getContext('2d'); c.scale(dpr,dpr);
  const r = from.getBoundingClientRect();
  const ox = r.right - 40, oy = r.top + r.height/2;   // 오른쪽 끝(만족) 얼굴 위치
  const colors = ['#4169E1','#E1332E','#FFC93C','#00DE5A','#FFFFFF','#16225A','#8FA6F0'];
  const P = Array.from({length:140}, ()=>{
    const a = -Math.PI/2 + (Math.random()-.5)*Math.PI*1.1, s = 7 + Math.random()*11;
    return {x:ox, y:oy, vx:Math.cos(a)*s, vy:Math.sin(a)*s, w:5+Math.random()*6, h:5+Math.random()*6,
      rot:Math.random()*6, vr:(Math.random()-.5)*.35, col:colors[(Math.random()*colors.length)|0]};
  });
  const t0 = performance.now();
  (function tick(t){
    const dt = t - t0; c.clearRect(0,0,W,H);
    P.forEach(p=>{
      p.vy += .38; p.vx *= .99; p.vy *= .992; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      c.save(); c.globalAlpha = Math.max(0, 1 - Math.max(0, dt-1700)/700);
      c.translate(p.x,p.y); c.rotate(p.rot); c.fillStyle = p.col; c.fillRect(-p.w/2,-p.h/2,p.w,p.h); c.restore();
    });
    if(dt < 2400) requestAnimationFrame(tick); else cv.remove();
  })(t0);
}

/* 줄바꿈 다듬기 : 〈작품명〉·「고유명」은 통째로 한 줄에 두고, 일본어·중국어는 단어(구) 경계에서만 줄바꿈 (<wbr> 삽입) */
const _seg = {};
const CLOSE = /^[。、，．,.!?！？；：:）)〉》」』”’]/, OPEN = /[（(〈《「『“‘]$/;
const NAME = /((?:〈[^〉]+〉|「[^」]+」)[를을에의가은는와과도로をにのはがとで的]?)/g;
function phraseWrap(root){
  const l = state.lang; if(l==='en') return;
  const seg = (l!=='ko' && l!=='ja' && typeof Intl!=='undefined' && Intl.Segmenter) ? (_seg[l] || (_seg[l] = new Intl.Segmenter(l==='ja'?'ja':l, {granularity:'word'}))) : null;
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode:n=>/^(INPUT|TEXTAREA|SCRIPT|STYLE)$/.test(n.parentNode.nodeName)||n.textContent.trim().length<3?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[]; let n; while(n=tw.nextNode()) nodes.push(n);
  const wbr = () => document.createElement('wbr');
  nodes.forEach(t=>{
    const text = t.textContent;
    if(!seg && l!=='ja' && !NAME.test(text)) { NAME.lastIndex=0; return; }
    NAME.lastIndex = 0;
    const frag = document.createDocumentFragment();
    const pieces = text.split(NAME);
    pieces.forEach((piece,i)=>{
      if(!piece) return;
      if(i%2===1){ const s=document.createElement('span'); s.style.whiteSpace='nowrap'; s.textContent=piece; frag.append(s); if(pieces[i+1] && !CLOSE.test(pieces[i+1]) && !/^\s/.test(pieces[i+1])) frag.append(wbr()); return; }
      if(l==='ja'){   // 일본어 : 히라가나(조사·어미) 뒤에서 한자/가타카나가 시작될 때만 줄바꿈 허용
        const MARK = '@@';
        piece
          .replace(/([\u3041-\u309F、。])(?=[\u30A0-\u30FF\u4E00-\u9FFF〈「（(“])/g, (m,c)=> (c==='ご'||c==='お') ? c : c+MARK)   // 히라가나 뒤에서 한자·가타카나 시작 (ご・お 접두어는 제외)
          .replace(/を(?=[\u3041-\u309F])/g, 'を'+MARK)                                                                  // 「…を|ありがとう」
          .split(MARK).forEach((c,k)=>{ if(k) frag.append(wbr()); frag.append(c); });
        return;
      }
      if(!seg){ frag.append(piece); return; }
      let buf='';
      [...seg.segment(piece)].forEach((s,k)=>{
        const p = s.segment;
        if(k>0 && !/\s$/.test(buf) && !/^\s/.test(p) && !CLOSE.test(p) && !OPEN.test(buf)){ frag.append(buf, wbr()); buf=''; }
        buf += p;
      });
      frag.append(buf);
    });
    t.replaceWith(frag);
  });
}

function setLang(l){

  state.lang = l;
  if(l==='ko'){ state.country=null; state.countryQuery=''; }
  else { state.consent=null; state.evName=''; state.evPhone=''; }                // 외국어 응답자에게는 이벤트 없음
  if(state.step===EVENT && l!=='ko') state.step = EVENT-1;
  try{ localStorage.setItem('lp_survey_lang', l); }catch(e){}
  render();
}
function pickLang(k){
  const wasForeign = state.langChosen && !isKo();
  state.reveal = !wasForeign && k!=='ko';      // 외국어를 처음 고를 때만 국가 영역이 부드럽게 나타남
  state.langChosen = true; state.dir = 0; state.focus = false; state.comboOpen = false;
  setLang(k);
}

app.addEventListener('click', e=>{
  const pl = e.target.closest('[data-pick-lang]');
  if(pl){ pickLang(pl.dataset.pickLang); const b=app.querySelector(`[data-pick-lang="${pl.dataset.pickLang}"]`); b&&b.focus({preventScroll:true}); return; }
  const co = e.target.closest('#countryList [data-code]');
  if(co){ chooseCountry(co.dataset.code); return; }
  const cs = e.target.closest('[data-consent]');
  if(cs){
    state.consent = cs.dataset.consent==='1'; state.dir=0; state.focus=false;
    render(); const sel=app.querySelector('[data-consent][aria-checked=true]'); sel&&sel.focus({preventScroll:true});
    return;
  }
  const ans = e.target.closest('[data-ans]');
  if(ans){
    const q = QUESTIONS[state.step];
    const v = ans.dataset.ans;
    state.answers[q.id] = q.type==='scale' ? Number(v) : v;
    if(q.type==='source' && v!=='other') state.sourceOther='';
    state.dir = 0; state.focus = false;
    render();                                   // 자동 이동 없음 : 선택만 반영
    const sel = app.querySelector('[aria-checked=true]'); if(sel) sel.focus({preventScroll:true});
    if(q.type==='source' && v==='other'){ const i=$('#otherIn'); i&&i.focus(); }
    return;
  }
  const act = e.target.closest('[data-act]');
  if(!act || act.disabled) return;
  const a = act.dataset.act;
  if(a==='start' || a==='next') go(1);
  else if(a==='prev') go(-1);
  else if(a==='submit') submit();
});
app.addEventListener('input', e=>{
  const id = e.target.id;
  if(id==='otherIn') state.sourceOther = e.target.value;
  else if(id==='commentIn'){ state.comment = e.target.value; $('#cnt').textContent = state.comment.length; }
  else if(id==='evName'){ state.evName = e.target.value; refreshNext(); }
  else if(id==='evPhone'){
    state.evPhone = fmtPhone(e.target.value); e.target.value = state.evPhone;
    if(state.phoneTouched) updatePhoneErr();
    refreshNext();
  }
  else if(id==='countryIn'){
    state.country = null; state.countryQuery = e.target.value; state.comboOpen = true; state.comboIdx = 0;
    drawCombo(); refreshNext();
  }
});
function updatePhoneErr(){
  const bad = state.consent===true && state.evPhone && !phoneOk(state.evPhone);
  const el = $('#phoneErr'), inp = $('#evPhone'); if(!el||!inp) return;
  el.textContent = bad ? EV.phoneErr : ''; el.classList.toggle('on', !!bad); inp.classList.toggle('bad', !!bad);
}
app.addEventListener('focusout', e=>{
  if(e.target.id==='evPhone'){ state.phoneTouched = true; updatePhoneErr(); }
  if(e.target.id==='countryIn'){
    setTimeout(()=>{ state.comboOpen=false; const inp=$('#countryIn'); if(inp && state.country) inp.value=countryName(state.country); drawCombo(); }, 120);
  }
});
app.addEventListener('focusin', e=>{
  if(e.target.id==='countryIn' && !state.comboOpen){ state.comboOpen=true; state.comboIdx=0; if(state.country) e.target.select(); drawCombo(); }
});
app.addEventListener('click', e=>{
  if(e.target.id==='countryIn' && !state.comboOpen){ state.comboOpen=true; drawCombo(); }
});
app.addEventListener('keydown', e=>{
  if(e.target.id==='countryIn'){
    const items = filteredCountries();
    if(e.key==='ArrowDown'){ e.preventDefault(); state.comboOpen=true; state.comboIdx=Math.min(items.length-1, state.comboIdx+1); drawCombo(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); state.comboIdx=Math.max(0, state.comboIdx-1); drawCombo(); }
    else if(e.key==='Enter'){ if(state.comboOpen && items[state.comboIdx]){ e.preventDefault(); chooseCountry(items[state.comboIdx].code); } }
    else if(e.key==='Escape'){ state.comboOpen=false; drawCombo(); }
    return;
  }
  if(e.target.id==='slider'){
    const el = e.target, cur = state.answers[el.dataset.q];
    let v = cur===undefined ? 3 : cur;
    if(e.key==='ArrowRight'||e.key==='ArrowUp') v = Math.min(5, v+1);
    else if(e.key==='ArrowLeft'||e.key==='ArrowDown') v = Math.max(1, v-1);
    else if(e.key==='Home') v = 1; else if(e.key==='End') v = 5; else return;
    e.preventDefault();
    snap(el, v);
    return;
  }
  // 라디오 그룹처럼 방향키로 이동
  if(!['ArrowDown','ArrowUp','ArrowLeft','ArrowRight'].includes(e.key)) return;
  const b = e.target.closest('[role=radio]'); if(!b) return;
  const list = [...b.parentElement.querySelectorAll('[role=radio]')];
  const i = list.indexOf(b), n = (e.key==='ArrowDown'||e.key==='ArrowRight') ? i+1 : i-1;
  if(list[n]){ e.preventDefault(); list[n].focus(); }
});
// 목록을 눌러도 입력창 포커스가 빠지지 않게
app.addEventListener('mousedown', e=>{ if(e.target.closest('#countryList')) e.preventDefault(); });

function go(d){
  if(d>0 && !canProceed()) return;
  state.dir = d; state.focus = true;
  let n = state.step + d;
  if(n>=EVENT && !isKo()) n = EVENT-1;          // 외국어 응답자는 이벤트 단계 없음
  state.step = Math.max(-2, Math.min(EVENT, n));
  state.error=false;
  render();
}

/* 언어 메뉴 */
const menu = $('#langMenu');
$('#langBtn').addEventListener('click', e=>{
  e.stopPropagation(); menu.classList.toggle('open');
  $('#langBtn').setAttribute('aria-expanded', menu.classList.contains('open'));
});
menu.addEventListener('click', e=>{
  const o = e.target.closest('.lang-opt'); if(!o) return;
  menu.classList.remove('open'); $('#langBtn').setAttribute('aria-expanded','false');
  if(state.step===-2) pickLang(o.dataset.lang);
  else { state.dir=0; state.focus=false; setLang(o.dataset.lang); }
});
document.addEventListener('click', ()=>{ menu.classList.remove('open'); $('#langBtn').setAttribute('aria-expanded','false'); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') menu.classList.remove('open'); });

/* ---------- 제출 ---------- */
function buildPayload(){
  const a = state.answers;
  const ko = isKo();
  const agreed = ko && state.consent===true;
  return {
    submittedAt: new Date().toISOString(),
    lang: state.lang,
    country: ko ? null : (state.country || null),   // ISO 3166-1 alpha-2, 기타 = OTHER
    source: a.source || '',
    sourceOther: a.source==='other' ? state.sourceOther.trim() : '',
    difficulty: a.difficulty,      // 1 매우 쉬움 … 5 매우 어려움
    story: a.story,                // 5 매우 만족 … 1 매우 불만족
    course: a.course,
    usage: a.usage,                // 1 매우 쉬웠다 … 5 매우 어려웠다 (난이도와 같은 방향)
    overall: a.overall,            // KPI
    recommend: a.recommend,        // 5 매우 그렇다 … 1 전혀 그렇지 않다
    comment: state.comment.trim(),
    privacyConsent: agreed,        // 개인정보 수집·이용 동의 (한국어 응답자만 true 가능)
    eventEntry: agreed,            // 동의한 경우에만 이벤트 추첨 대상
    name: agreed ? state.evName.trim() : '',
    phone: agreed ? state.evPhone : '',
  };
}
async function submit(){
  if(state.sending || !canProceed()) return;
  state.sending = true; state.error = false; state.dir = 0; render();
  const payload = buildPayload();
  // 항상 이 기기에도 백업 (전송 성공 시 삭제)
  try{
    const q = JSON.parse(localStorage.getItem('lp_survey_queue')||'[]');
    q.push(payload); localStorage.setItem('lp_survey_queue', JSON.stringify(q));
  }catch(e){}
  let ok = true;
  if(ENDPOINT){
    try{
      await fetch(ENDPOINT, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload)});
    }catch(e){ ok = false; }
  }
  state.sending = false;
  if(ok){
    try{ localStorage.removeItem('lp_survey_queue'); if(!ENDPOINT) localStorage.setItem('lp_survey_queue', JSON.stringify([payload])); }catch(e){}
    state.dir = 1; state.focus = true; state.step = DONE;
  } else state.error = true;
  render();
}

/* ---------- 시작 ---------- */
(function init(){
  // ?lang=ko 처럼 링크로 언어를 미리 정할 수 있음 (QR 코드 언어별 배포용). 외국어는 국가 선택이 필요해 첫 화면에 머뭅니다.
  const p = new URLSearchParams(location.search).get('lang');
  if(p && LANGS[p]){
    state.lang=p; state.langChosen=true;
    if(p==='ko') state.step=-1;
  }
  render();
})();
</script>
